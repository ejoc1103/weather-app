<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <title>Weather Journal</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <div>
    <div class="headline">Weather Journal App</div>
  </div>



  <div id="app">

    <form action="submit">

      <div class="infoContainer">
  
          <div for="zip" id="zipInfo">
            <div class="subLine">
              Enter Zipcode here:
            </div>
            <input type="text" class="zip" id="zip" placeholder="ZIP" />
            <div class="gutter"></div>
          </label>
   
      </div>

      <div >

          <div for="feelings" id="feelInfo">
            
              <div class="subLine2">
                How are you feeling today?
              </div>
              <textarea class="myInput" id="feelings" placeholder="Today I feel . . ." rows="9" cols="50"></textarea>
              
              <div class="info">

                <button id="generate" type="submit">Generate</button>

              </div>
          </label>
        </div>

      </div>

    </form>
    <div id="entry">
      <div class="title">Most Recent Entries</div>
      <div id="entryContainer"></div>
    </div>
  </div>
  <script src="app.js" type="text/javascript"></script>
</body>

</html>
